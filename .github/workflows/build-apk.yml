name: Build Android APK

# クラウドAPKビルド専用ワークフロー
# main にプッシュ、または手動実行で APK を生成しアーティファクトに添付する。
# シークレットが未設定でも動作する（テストビルド）。

on:
  push:
    branches: [main, develop]
    paths:
      - 'frontend_flutter/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'バックエンドのベースURL (空欄でリポジトリ変数 vars.API_BASE_URL を使用)'
        required: false
        default: ''
      func_key:
        description: 'Azure Functions の関数キー (空欄でリポジトリシークレット secrets.FUNC_KEY を使用)'
        required: false
        default: ''

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.1'
          channel: stable
          cache: true

      - name: Generate Android platform files
        # `flutter create .` で lib/ は保持したまま android/ の不足ファイルを補完。
        # リポジトリ管理下のファイル（カメラ権限入りManifest・ランチャーアイコン等）は
        # flutter create に上書きされるため git から復元する。
        working-directory: frontend_flutter
        run: |
          flutter create --project-name aoi_rail_planner --org com.aoirail --platforms=android .
          git checkout -- android/app/src/main/AndroidManifest.xml || true
          git checkout -- android/app/src/main/res || true

      - name: Patch build.gradle.kts for plugin compatibility
        # camera_android が compileSdk=36, NDK 27.0.12077973 を要求するため上書き
        working-directory: frontend_flutter
        run: |
          GRADLE=android/app/build.gradle.kts
          echo "--- before ---"
          cat $GRADLE
          # compileSdk と ndkVersion を強制的に書き換える
          sed -i 's|compileSdk = flutter.compileSdkVersion|compileSdk = 36|' $GRADLE
          sed -i 's|ndkVersion = flutter.ndkVersion|ndkVersion = "27.0.12077973"|' $GRADLE
          # フォールバック: 直接行が無い場合は android { ブロック先頭に追加
          if ! grep -q "compileSdk = 36" $GRADLE; then
            sed -i '/android {/a\    compileSdk = 36\n    ndkVersion = "27.0.12077973"' $GRADLE
          fi
          echo "--- after ---"
          cat $GRADLE

      - name: Install dependencies
        working-directory: frontend_flutter
        run: flutter pub get

      - name: Resolve build defines
        id: defines
        env:
          INPUT_API: ${{ github.event.inputs.api_base_url }}
          INPUT_KEY: ${{ github.event.inputs.func_key }}
          VAR_API:   ${{ vars.API_BASE_URL }}
          SEC_KEY:   ${{ secrets.FUNC_KEY }}
        run: |
          # 優先順位: workflow_dispatch の input → リポジトリ変数/シークレット → fallback
          API="${INPUT_API:-${VAR_API:-https://example.invalid/api}}"
          KEY="${INPUT_KEY:-${SEC_KEY:-}}"
          echo "api_base_url=$API" >> $GITHUB_OUTPUT
          echo "func_key=$KEY" >> $GITHUB_OUTPUT
          # 検証ログ（キーはマスクされた状態で出る）
          echo "Resolved API_BASE_URL: $API"
          echo "FUNC_KEY length: ${#KEY}"

      - name: Build debug APK
        working-directory: frontend_flutter
        run: |
          flutter build apk --debug \
            --dart-define=API_BASE_URL=${{ steps.defines.outputs.api_base_url }} \
            --dart-define=FUNC_KEY=${{ steps.defines.outputs.func_key }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aoi-rail-planner-debug-apk
          path: frontend_flutter/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30

      # ---- 署名付き release ビルド（KEYSTORE_BASE64 シークレットがある場合のみ）----
      - name: Build signed release APK
        id: release_build
        continue-on-error: true
        working-directory: frontend_flutter
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_PATH: /tmp/upload-keystore.p12
        run: |
          if [ -z "$KS_B64" ]; then
            echo "no keystore secret - skipping release build"
            exit 0
          fi
          # CRLF・空白が混入していても確実にデコードできるようにする
          echo "$KS_B64" | tr -d '\r\n ' | base64 -d > "$KS_PATH"
          ls -l "$KS_PATH"

          GRADLE=android/app/build.gradle.kts
          # release ビルドタイプの署名をアップロード鍵に差し替える
          sed -i 's|signingConfig = signingConfigs.getByName("debug")|signingConfig = signingConfigs.create("upload") { storeFile = file(System.getenv("KS_PATH")!!); storePassword = System.getenv("KS_PASS"); keyAlias = "upload"; keyPassword = System.getenv("KS_PASS") }|' $GRADLE
          grep -n "signingConfigs" $GRADLE || true

          flutter build apk --release \
            --dart-define=API_BASE_URL=${{ steps.defines.outputs.api_base_url }} \
            --dart-define=FUNC_KEY=${{ steps.defines.outputs.func_key }}
          ls -lh build/app/outputs/flutter-apk/

      - name: Upload release APK
        if: steps.release_build.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: aoi-rail-planner-release-apk
          path: frontend_flutter/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Job summary
        run: |
          echo "## 📱 APK ビルド完了" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "ダウンロードしてスマホにインストールしてください。" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          SIZE=$(du -h frontend_flutter/build/app/outputs/flutter-apk/app-debug.apk | cut -f1)
          echo "- ファイル: app-debug.apk ($SIZE)" >> $GITHUB_STEP_SUMMARY
          echo "- API_BASE_URL: ${{ steps.defines.outputs.api_base_url }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### スマホへのインストール手順" >> $GITHUB_STEP_SUMMARY
          echo "1. 上の Artifacts セクションから aoi-rail-planner-debug-apk.zip をダウンロード" >> $GITHUB_STEP_SUMMARY
          echo "2. zip を展開して APK をスマホに転送（Googleドライブ/メール添付/USB）" >> $GITHUB_STEP_SUMMARY
          echo "3. スマホで APK を開いてインストール（提供元不明アプリの許可が必要）" >> $GITHUB_STEP_SUMMARY
