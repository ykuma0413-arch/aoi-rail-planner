name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ---- バックエンド: Pythonテスト ----
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend_azure_functions

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run algorithm tests
        run: python test_algorithm.py

      - name: Run Cosmos DB retry tests
        run: python test_cosmos_retry.py

      - name: Check compliance (no forbidden strings)
        run: |
          # コンプライアンスチェック: 禁止文字列が含まれていないことを確認
          if grep -rn "プラレール\|タカラトミー" layout_generator/ ; then
            echo "❌ 禁止文字列が検出されました"
            exit 1
          fi
          echo "✅ コンプライアンスチェック通過"

  # ---- フロントエンド: Flutter テスト ----
  flutter-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend_flutter

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.1"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Check compliance (no forbidden strings)
        run: |
          if grep -rn "プラレール\|タカラトミー" lib/ ; then
            echo "❌ 禁止文字列が検出されました"
            exit 1
          fi
          echo "✅ コンプライアンスチェック通過"

  # ---- Android ビルド ----
  flutter-build-android:
    runs-on: ubuntu-latest
    needs: flutter-test
    if: github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: frontend_flutter

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.1"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (debug)
        run: |
          flutter build apk --debug \
            --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL }} \
            --dart-define=FUNC_KEY=${{ secrets.FUNC_KEY }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: frontend_flutter/build/app/outputs/flutter-apk/app-debug.apk

  # ---- Azure Functions デプロイ ----
  deploy-backend:
    runs-on: ubuntu-latest
    needs: backend-test
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ secrets.AZURE_FUNCTIONAPP_NAME }}
          package: backend_azure_functions
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
          scm-do-build-during-deployment: true
          enable-oryx-build: true
