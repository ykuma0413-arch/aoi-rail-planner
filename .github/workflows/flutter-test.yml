name: Flutter Tests

# 描画・走行レイヤーテスト（test/ 以下全て）の実行環境。
# ローカルに Flutter SDK が無いため、LOOP はこのワークフローを
# gh workflow run で起動して pass/fail を判定する。

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'frontend_flutter/lib/rail/**'
      - 'frontend_flutter/lib/views/**'
      - 'frontend_flutter/test/**'
      - '.github/workflows/flutter-test.yml'

jobs:
  flutter-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.1'
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: frontend_flutter
        run: flutter pub get

      - name: Analyze rail/route layer
        working-directory: frontend_flutter
        # 既存コードの deprecation info では落とさない（warning/error のみ致命）
        run: flutter analyze --no-fatal-infos lib/rail lib/views/layout_canvas_view.dart test

      - name: Run simulator tests (render + train route)
        working-directory: frontend_flutter
        run: flutter test -r expanded
