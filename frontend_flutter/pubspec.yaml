name: aoi_rail_planner
description: おまかせAIレールプランナー

publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # 状態管理
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # カメラ & 推論
  camera: ^0.11.0+2
  tflite_flutter: ^0.11.0

  # ローカル保存
  sqflite: ^2.3.3
  path_provider: ^2.1.3
  path: ^1.9.0

  # 設定永続化
  shared_preferences: ^2.3.2

  # API通信
  http: ^1.2.1

  # URL起動（アフィリエイトリンク）
  url_launcher: ^6.3.0

  # ランタイム権限（Android 6+ カメラ等）
  permission_handler: ^11.3.1

  # 画像処理
  image: ^4.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.3
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
